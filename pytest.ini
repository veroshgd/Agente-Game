[pytest]
# ★ 为什么需要这个文件 ★
# 仓库里有三份同名模块：根目录、v2_frozen/、v3_frozen/ 各有一套
# `p1_test.py` / `p2_test.py` / `relaxation_test.py` / `rule48_test.py` /
# `test_022_regression.py`。pytest 按 basename 建模块名，于是
# `import file mismatch` —— 10 个 collection error，一个测试都收不上来。
#
# 不能靠改 frozen 目录来解决：那两个目录有 SHA256SUMS.txt，改了就破坏冻结。
# 所以在根目录限定收集范围。
#
# 另外：根目录那些 `*_test.py` **不是 pytest 测试**，是实验脚本
# （跑起来是几十分钟的模拟）。限定 testpaths 同时避免了它们被误收。

testpaths = tests
norecursedirs = v2_frozen v3_frozen __pycache__ .git
addopts = -q
